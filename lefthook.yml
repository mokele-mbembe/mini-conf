pre-commit:
  parallel: true
  commands:
    fmt-backend:
      run: bash -lc 'source scripts/load-dev-env.sh; just fmt-backend'
      stage_fixed: true
    fmt-frontend:
      run: bash -lc 'source scripts/load-dev-env.sh; just fmt-frontend'
      stage_fixed: true
    lint-backend:
      run: bash -lc 'source scripts/load-dev-env.sh; just lint-backend'
    lint-frontend:
      run: bash -lc 'source scripts/load-dev-env.sh; just lint-frontend'

pre-push:
  commands:
    openapi-check:
      run: bash -lc 'source scripts/load-dev-env.sh; just openapi-check'
    test:
      run: bash -lc 'source scripts/load-dev-env.sh; just test'
    perf-smoke:
      run: bash -lc 'source scripts/load-dev-env.sh; just perf-smoke'
