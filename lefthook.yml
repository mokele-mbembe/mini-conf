pre-commit:
  parallel: true
  commands:
    fmt-backend:
      run: just fmt-backend
      stage_fixed: true
    fmt-frontend:
      run: just fmt-frontend
      stage_fixed: true
    lint-backend:
      run: just lint-backend
    lint-frontend:
      run: just lint-frontend

pre-push:
  commands:
    test:
      run: just test
    perf-smoke:
      run: just perf-smoke
