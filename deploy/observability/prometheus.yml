global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules/mini-conf-alerts.yml

scrape_configs:
  - job_name: mini-conf
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8080
        labels:
          service: mini-conf
          environment: production
