name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Set up Rust
        if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: baptiste0928/cargo-install@v3
        with:
          crate: sqlx-cli
          args: --no-default-features --features rustls,postgres

      - name: Install cargo-nextest
        if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-nextest
          locked: true

      - name: Set up pnpm
        if: ${{ hashFiles('package.json', 'pnpm-workspace.yaml', 'apps/web/package.json') != '' }}
        uses: pnpm/action-setup@v5

      - name: Set up Node
        if: ${{ hashFiles('package.json', 'pnpm-workspace.yaml', 'apps/web/package.json') != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        run: pnpm install --frozen-lockfile

      - name: Install apps/web dependencies
        if: ${{ hashFiles('pnpm-lock.yaml') == '' && hashFiles('apps/web/package.json') != '' }}
        run: pnpm --dir apps/web install --no-frozen-lockfile

      - name: Lint
        run: just lint

      - name: SQLx check
        run: just sqlx-check

      - name: OpenAPI check
        run: just openapi-check

      - name: Test
        run: just test

      - name: Performance smoke
        run: just perf-smoke

      - name: Upload perf smoke artifact
        if: ${{ always() && hashFiles('target/perf/smoke.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: perf-smoke
          path: target/perf/smoke.json

  backend-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Set up Rust
        if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: baptiste0928/cargo-install@v3
        with:
          crate: sqlx-cli
          args: --no-default-features --features rustls,postgres

      - name: Install cargo-nextest
        if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-nextest
          locked: true

      - name: Run migrations
        run: just db-migrate-up

      - name: Run backend DB tests
        run: just test-backend-db
